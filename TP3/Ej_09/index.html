<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 9 - Galería de productos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Productos</h1>

    <div class="galeria">
        <!-- Producto 1 -->
        <article class="producto">
            <img src="https://picsum.photos/300/200?1" alt="Producto 1: auriculares">
            <h3>Auriculares</h3>
            <p class="precio">$15.000</p>
            <button>Comprar</button>
        </article>

        <!-- Producto 2 -->
        <article class="producto">
            <img src="https://picsum.photos/300/200?2" alt="Producto 2: teclado mecánico">
            <h3>Teclado mecánico</h3>
            <p class="precio">$42.000</p>
            <button>Comprar</button>
        </article>

        <!-- Producto 3 -->
        <article class="producto">
            <img src="https://picsum.photos/300/200?3" alt="Producto 3: mouse inalámbrico">
            <h3>Mouse inalámbrico</h3>
            <p class="precio">$18.500</p>
            <button>Comprar</button>
        </article>

        <!-- Producto 4 -->
        <article class="producto">
            <img src="https://picsum.photos/300/200?4" alt="Producto 4: monitor 24 pulgadas">
            <h3>Monitor 24"</h3>
            <p class="precio">$180.000</p>
            <button>Comprar</button>
        </article>

        <!-- Producto 5 -->
        <article class="producto">
            <img src="https://picsum.photos/300/200?5" alt="Producto 5: webcam Full HD">
            <h3>Webcam Full HD</h3>
            <p class="precio">$27.000</p>
            <button>Comprar</button>
        </article>

        <!-- Producto 6 -->
        <article class="producto">
            <img src="https://picsum.photos/300/200?6" alt="Producto 6: parlante Bluetooth">
            <h3>Parlante Bluetooth</h3>
            <p class="precio">$33.000</p>
            <button>Comprar</button>
        </article>
    </div>
</body>
</html>
