<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 12 - Posicionamiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Posicionamiento</h1>
    <p>Pasá el mouse sobre el botón para ver el tooltip.</p>

    <div class="contenedor-tooltip">
        <button>Hover aquí</button>
        <span class="tooltip">¡Soy un tooltip!</span>
    </div>

    <!-- Mucho contenido para que haya scroll -->
    <p style="height: 1500px;">Contenido largo...</p>

    <!-- Botón fijo abajo a la derecha -->
    <a href="#" class="volver-arriba">↑</a>
</body>
</html>
