<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facundo Federico Olguín | UX/UI Designer</title>
  <meta name="description" content="Portfolio de Facundo Federico Olguín, UX/UI Designer y estudiante de Sistemas de Información enfocado en experiencias claras y funcionales.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Google Fonts: Inter & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Stylesheet compilado de Tailwind -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-white text-content font-sans antialiased min-h-screen flex flex-col">

  <!-- Skip link de accesibilidad -->
  <a href="#contenido-principal" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-primary focus:text-white focus:rounded-md focus:shadow-md">
    Saltar al contenido
  </a>

  <!-- Header & Navegación -->
  <header id="header" class="w-full bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-stroke transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- Logo / Iniciales -->
      <a href="#hero" class="flex items-center gap-3 group focus:outline-none focus-visible:ring-2 focus-visible:ring-primary rounded-lg p-1" aria-label="Facundo Olguín - Inicio">
        <span class="w-10 h-10 rounded-xl bg-primary text-white flex items-center justify-center font-bold text-lg font-sans tracking-tight shadow-sm group-hover:bg-primary-dark transition-colors">
          FO
        </span>
        <div class="flex flex-col">
          <span class="font-serif font-bold text-content text-lg leading-tight tracking-tight">
            Facundo Olguín
          </span>
          <span class="text-xs text-content-secondary font-medium tracking-wide">
            UX/UI Designer
          </span>
        </div>
      </a>

      <!-- Navegación Desktop -->
      <nav class="hidden md:flex items-center gap-8" aria-label="Navegación principal">
        <a href="#proyectos" class="text-sm font-medium text-content-secondary hover:text-primary transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary rounded py-1 px-2">
          Proyectos
        </a>
        <a href="#sobre-mi" class="text-sm font-medium text-content-secondary hover:text-primary transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary rounded py-1 px-2">
          Sobre mí
        </a>
        <a href="#contacto" class="text-sm font-medium text-content-secondary hover:text-primary transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary rounded py-1 px-2">
          Contacto
        </a>
        
        <!-- CTA Header Desktop -->
        <a href="#contacto" class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-primary hover:bg-primary-dark rounded-lg transition-colors shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2">
          Hablemos
        </a>
      </nav>

      <!-- Botón Menú Mobile (Hamburguesa) -->
      <div class="flex items-center md:hidden">
        <button
          type="button"
          id="menu-toggle"
          aria-label="Abrir menú de navegación"
          aria-expanded="false"
          aria-controls="mobile-menu"
          class="p-2 text-content-secondary hover:text-primary hover:bg-surface-card rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"
        >
          <!-- Icono Lucide: Menu -->
          <svg id="icon-menu" class="w-6 h-6 stroke-current" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" x2="20" y1="12" y2="12"></line>
            <line x1="4" x2="20" y1="6" y2="6"></line>
            <line x1="4" x2="20" y1="18" y2="18"></line>
          </svg>
          <!-- Icono Lucide: X -->
          <svg id="icon-close" class="w-6 h-6 stroke-current hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>

    </div>

    <!-- Menú Mobile desplegable -->
    <nav id="mobile-menu" class="hidden md:hidden border-t border-stroke bg-white px-4 pt-3 pb-6 space-y-3 shadow-lg" aria-label="Navegación móvil">
      <a href="#proyectos" class="mobile-nav-link block px-3 py-2 rounded-md text-base font-medium text-content hover:text-primary hover:bg-surface-card transition-colors">
        Proyectos
      </a>
      <a href="#sobre-mi" class="mobile-nav-link block px-3 py-2 rounded-md text-base font-medium text-content hover:text-primary hover:bg-surface-card transition-colors">
        Sobre mí
      </a>
      <a href="#contacto" class="mobile-nav-link block px-3 py-2 rounded-md text-base font-medium text-content hover:text-primary hover:bg-surface-card transition-colors">
        Contacto
      </a>
      <div class="pt-2">
        <a href="#contacto" class="mobile-nav-link w-full flex items-center justify-center px-4 py-2.5 text-base font-medium text-white bg-primary hover:bg-primary-dark rounded-lg transition-colors shadow-sm">
          Hablemos
        </a>
      </div>
    </nav>
  </header>

  <!-- Contenido Principal -->
  <main id="contenido-principal" class="flex-grow">
    
    <!-- Sección: Hero -->
    <section id="hero" class="relative overflow-hidden">
      <!-- El contenido del hero se completará en la Fase 3 -->
    </section>

    <!-- Sección: Proyectos -->
    <section id="proyectos" class="py-16 md:py-24">
      <!-- La grilla de proyectos se completará en la Fase 4 -->
    </section>

    <!-- Sección: Sobre mí -->
    <section id="sobre-mi" class="py-16 md:py-24 bg-surface-card">
      <!-- El contenido de sobre mí se completará en la Fase 6 -->
    </section>

    <!-- Sección: Contacto -->
    <section id="contacto" class="py-16 md:py-24">
      <!-- El contenido de contacto se completará en la Fase 7 -->
    </section>

  </main>

  <!-- Footer -->
  <footer id="footer" class="border-t border-stroke bg-white">
    <!-- El contenido del footer se completará en la Fase 7 -->
  </footer>

  <!-- Contenedor Modal de Caso de Estudio (Fase 5) -->
  <div id="modal-container" aria-hidden="true"></div>

  <!-- JavaScript -->
  <script src="script.js" defer></script>
</body>
</html>
